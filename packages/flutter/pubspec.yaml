name: fluent2_flutter
description: Native Fluent 2 components with official Microsoft tokens, Web and Teams themes, and a matching Compose Multiplatform port.
version: 0.1.0
publish_to: none
environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.32.0'
dependencies:
  flutter:
    sdk: flutter
  path_drawing: ^1.0.1
  cupertino_icons: ^1.0.8
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
